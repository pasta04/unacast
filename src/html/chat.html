<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>unacast - chat</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="/css/style-server.css" />
  <!-- アプリ内ウィンドウ専用の既定値 (背景色など)。ユーザカスタム CSS より前に読むこと -->
  <link rel="stylesheet" href="/css/style-window.css" />
  <!--
    ユーザカスタム CSS。packaged app の resources/style-server.css を読みに行く。
    chat.html は dist/renderer/src/html/ に出力されるため、ここから resources/ までは 5 階層上。
    asar 版ではこの相対パスが asar の外へ出て物理 resources/ を指す。
    ファイルが存在しなくても 404 で黙って無視されるので副作用なし。
    詳細: documents/見た目のカスタム.md
  -->
  <link rel="stylesheet" href="../../../../../style-server.css" />
  <script type="module" src="../renderer/chat.ts"></script>
  <script>
    /** URLをクリックした時の動作 */
    const urlopen = (url) => {
      const { shell } = require('electron');
      let tmp = url;
      if (url.match(/^ttp/)) {
        tmp = `h${url}`;
      }
      shell.openExternal(tmp);
    };

    /** サムネ画像をクリックした時の動作 */
    const imageopen = (url) => {
      const { ipcRenderer } = require('electron');
      ipcRenderer.send("PREVIEW_IMAGE", url);
    };
  </script>
  <style>
    body {
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <div id="parent">
    <ul id="res-list" style="margin: 0px;"></ul>
  </div>
</body>

</html>
